name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar projeto
        run: |
          unzip -o JogoComSenha-GitHub-Pronto.zip -d projeto
          find projeto -name gradlew -type f -exec chmod +x {} \;

      - name: Gerar APK
        run: |
          GRADLEW=$(find projeto -name gradlew -type f | head -1)
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Jogo
          path: projeto/**/build/outputs/apk/**/*.apk
